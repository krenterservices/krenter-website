<div class="register-container">
  <h2>Create Your Krenter Account</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div *ngIf="registerError" class="error-message">
      {{ registerError }}
    </div>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" formControlName="name" [disabled]="isLoading">
      <div *ngIf="nameError" class="error">
        {{ nameError }}
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" [disabled]="isLoading">
      <div *ngIf="emailError" class="error">
        {{ emailError }}
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" formControlName="password" [disabled]="isLoading">
      <div *ngIf="passwordError" class="error">
        {{ passwordError }}
      </div>
      <small>Minimum 6 characters</small>
    </div>

    <div class="form-group">
      <label>I am a:</label>
      <div class="role-selection">
        <label class="role-option">
          <input type="radio" formControlName="role" value="renter" [disabled]="isLoading">
          <span class="role-label">
            <strong>Renter</strong>
            <small>{{ getRoleDescription('renter') }}</small>
          </span>
        </label>
        <label class="role-option">
          <input type="radio" formControlName="role" value="owner" [disabled]="isLoading">
          <span class="role-label">
            <strong>Owner</strong>
            <small>{{ getRoleDescription('owner') }}</small>
          </span>
        </label>
      </div>
    </div>

    <button type="submit" [disabled]="registerForm.invalid || isLoading">
      <span *ngIf="!isLoading">Create Account</span>
      <span *ngIf="isLoading">Creating Account...</span>
    </button>
  </form>

  <p class="login-link">
    Already have an account? <a routerLink="/login">Login here</a>
  </p>
</div>
