<div class="properties-container">
  <h2>Available Properties</h2>
  <div class="filter-container">
    <input type="text" placeholder="Search by name, type, or location..." (input)="onSearch($event)">
    <select (change)="onFilterChange($event, 'type')">
      <option value="">All Types</option>
      <option *ngFor="let type of uniqueTypes" [value]="type">{{ type }}</option>
    </select>
    <select (change)="onFilterChange($event, 'location')">
      <option value="">All Locations</option>
      <option *ngFor="let location of uniqueLocations" [value]="location">{{ location }}</option>
    </select>
    <select (change)="onSortChange($event)">
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="name-asc">Name: A to Z</option>
      <option value="name-desc">Name: Z to A</option>
    </select>
  </div>
  <div class="property-list">
    <a *ngFor="let property of paginatedProperties" [routerLink]="['/property', property.id]" class="property-card-link">
      <div class="property-card">
        <div class="property-image">
          <span>Image coming soon</span>
        </div>
        <div class="property-details">
          <h3>{{ property.name }}</h3>
          <p><strong>Type:</strong> {{ property.type }}</p>
          <p><strong>Price:</strong> ${{ property.price }}/month</p>
          <p><strong>Location:</strong> {{ property.location }}</p>
        </div>
      </div>
    </a>
  </div>
  <div class="pagination-container">
    <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">Previous</button>
    <span>Page {{ currentPage }} of {{ totalPages }}</span>
    <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">Next</button>
  </div>
</div>
