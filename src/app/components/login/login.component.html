<div class="login-container">
  <h2>Login to Krenter</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    @if (loginError) {
    <div class="error-message">
      {{ loginError }}
    </div>
    }
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" [disabled]="isLoading">
      @if (emailError) {
      <div class="error">
        {{ emailError }}
      </div>
      }
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" formControlName="password" [disabled]="isLoading">
      @if (passwordError) {
      <div class="error">
        {{ passwordError }}
      </div>
      }
    </div>
    <button type="submit" [disabled]="loginForm.invalid || isLoading">
      @if (!isLoading) {
      <span>Login</span>
      }
      @if (isLoading) {
      <span>Logging in...</span>
      }
    </button>
  </form>
  <p class="register-link">
    Don't have an account? <a routerLink="/register">Register here</a>
  </p>
</div>
